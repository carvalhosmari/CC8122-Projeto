<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1410" viewBox="0 0 1600 1410" role="img" aria-labelledby="title desc">
  <title id="title">M01 - Avaliar tomografia renal com apoio do modelo</title>
  <desc id="desc">MoLIC de CI01. Ponto de abertura, cenas de localizar, conferir, interpretar e prosseguir; processamentos de busca e analise; rupturas de busca vazia, exame divergente e falha de processamento; retorno para corrigir ou tentar novamente; pontos de encerramento da consulta e da interrupcao.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 4.5 L0 9 Z" fill="#253c3a"/>
    </marker>
    <marker id="break-arrow" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 4.5 L0 9 Z" fill="#a66335"/>
    </marker>
  </defs>
  <rect width="1600" height="1410" fill="#f7f8f5"/>
  <text x="40" y="50" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#253c3a">M01 / Avaliar tomografia renal</text>
  <text x="40" y="80" font-family="Arial, sans-serif" font-size="17" fill="#526460">CI01 / P01 / T01 / O01-O05 | Prot&#243;tipo acad&#234;mico; a decis&#227;o cl&#237;nica permanece com Mario.</text>

  <!-- Cenas: topicos e signos de dialogo, sem transcrever falas. -->
  <g fill="#ffffff" stroke="#253c3a" stroke-width="2.5">
    <rect x="120" y="150" width="330" height="250" rx="19"/>
    <rect x="810" y="150" width="330" height="250" rx="19"/>
    <rect x="120" y="545" width="330" height="205" rx="19"/>
    <rect x="810" y="545" width="330" height="205" rx="19"/>
    <rect x="1200" y="545" width="335" height="205" rx="19"/>
    <rect x="805" y="940" width="440" height="300" rx="19"/>
    <rect x="310" y="940" width="370" height="270" rx="19"/>
  </g>
  <g stroke="#96aaa3" stroke-width="1.5">
    <path d="M120 202 H450 M810 202 H1140 M120 597 H450 M810 597 H1140 M1200 597 H1535 M805 992 H1245 M310 992 H680"/>
  </g>

  <g font-family="Arial, sans-serif" fill="#253c3a">
    <g font-size="21" font-weight="700">
      <text x="141" y="185">Localizar o caso (O02)</text>
      <text x="831" y="185">Confirmar caso (O02)</text>
      <text x="141" y="580">Rever busca sem resultado</text>
      <text x="831" y="580">Corrigir caso divergente</text>
      <text x="1221" y="580">Lidar com falha da an&#225;lise</text>
      <text x="826" y="975">Interpretar indica&#231;&#227;o (O04)</text>
      <text x="331" y="975">Prosseguir (O05)</text>
    </g>
    <g font-size="18">
      <text x="141" y="238">d+u: crit&#233;rio de busca,</text>
      <text x="141" y="265">correspond&#234;ncia da busca</text>

      <text x="831" y="238">d+u: paciente, exame vinculado,</text>
      <text x="831" y="265">confirma&#231;&#227;o do caso,</text>
      <text x="831" y="302">estado da an&#225;lise</text>

      <text x="141" y="633">d+u: correspond&#234;ncia da busca,</text>
      <text x="141" y="660">crit&#233;rio de busca</text>

      <text x="831" y="633">d+u: paciente, exame vinculado,</text>
      <text x="831" y="660">confirma&#231;&#227;o do caso</text>

      <text x="1221" y="633">d+u: estado da an&#225;lise,</text>
      <text x="1221" y="660">exame vinculado</text>

      <text x="826" y="1027">d+u: classe prevista,</text>
      <text x="826" y="1054">confian&#231;a do modelo,</text>
      <text x="826" y="1081">regi&#227;o destacada,</text>
      <text x="826" y="1108">texto sugerido,</text>
      <text x="826" y="1135">imagens da tomografia,</text>
      <text x="826" y="1162">laudo original,</text>
      <text x="826" y="1189">informa&#231;&#245;es cl&#237;nicas</text>
      <text x="826" y="1216">dispon&#237;veis</text>

      <text x="331" y="1029">d+u: avalia&#231;&#227;o inconclusiva,</text>
      <text x="331" y="1066">pr&#243;ximos passos cl&#237;nicos,</text>
      <text x="331" y="1093">hist&#243;rico de an&#225;lises</text>
    </g>
  </g>

  <!-- Processamentos do sistema: sem falas U nem detalhes internos do algoritmo. -->
  <g fill="#253c3a">
    <rect x="535" y="210" width="195" height="120" rx="8"/>
    <rect x="1240" y="210" width="215" height="120" rx="8"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#ffffff">
    <text x="632" y="253">Consultar registros</text>
    <text x="632" y="281">da base local</text>
    <text x="632" y="307" font-size="16">O02</text>
    <text x="1347" y="253">Analisar imagens</text>
    <text x="1347" y="281">vinculadas ao caso</text>
    <text x="1347" y="307" font-size="16">O03</text>
  </g>

  <!-- Pontos de abertura e de encerramento (duplo circulo). -->
  <circle cx="65" cy="270" r="15" fill="#253c3a"/>
  <g fill="#f7f8f5" stroke="#253c3a" stroke-width="2.5">
    <circle cx="94" cy="835" r="20"/><circle cx="94" cy="835" r="10" fill="#253c3a"/>
    <circle cx="1550" cy="850" r="20"/><circle cx="1550" cy="850" r="10" fill="#253c3a"/>
    <circle cx="155" cy="1080" r="20"/><circle cx="155" cy="1080" r="10" fill="#253c3a"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="17" fill="#253c3a">
    <text x="42" y="879">Interrompida</text>
    <text x="1432" y="893">Sem resultado</text>
    <text x="64" y="1125">Consulta encerrada</text>
  </g>

  <!-- Transicoes do caminho principal; os signos envolvidos estao nas cenas. -->
  <g fill="none" stroke="#253c3a" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M80 270 H117"/>
    <path d="M453 270 H532"/>
    <path d="M733 270 H807"/>
    <path d="M1143 270 H1237"/>
    <path d="M1237 310 H1165 V855 H1025 V937"/>
    <path d="M802 1080 H683"/>
    <path d="M307 1080 H178"/>
    <path d="M500 1213 V1283 H1025 V1243"/>
  </g>
  <!-- Rupturas: entrada no reparo tracejada, retorno ou saida continua. -->
  <g fill="none" stroke="#a66335" stroke-width="2.5" stroke-dasharray="9 6" marker-end="url(#break-arrow)">
    <path d="M630 333 V480 H300 V542"/>
    <path d="M975 403 V542"/>
    <path d="M1360 333 V542"/>
  </g>
  <g fill="none" stroke="#253c3a" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M170 542 V403"/>
    <path d="M807 650 H795 V115 H300 V147"/>
    <path d="M1538 635 H1570 V130 H1350 V207"/>
    <path d="M117 375 H94 V812"/>
    <path d="M117 720 H94 V812"/>
    <path d="M1538 710 H1570 V827"/>
  </g>
  <line x1="40" y1="1350" x2="93" y2="1350" stroke="#253c3a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="108" y="1356" font-family="Arial, sans-serif" font-size="16" fill="#253c3a">transi&#231;&#227;o</text>
  <line x1="325" y1="1350" x2="378" y2="1350" stroke="#a66335" stroke-width="2.5" stroke-dasharray="9 6" marker-end="url(#break-arrow)"/>
  <text x="393" y="1356" font-family="Arial, sans-serif" font-size="16" fill="#253c3a">ruptura com retorno</text>
  <rect x="630" y="1334" width="42" height="31" rx="6" fill="#253c3a"/>
  <text x="684" y="1356" font-family="Arial, sans-serif" font-size="16" fill="#253c3a">processamento do sistema</text>
  <text x="1040" y="1356" font-family="Arial, sans-serif" font-size="16" fill="#253c3a">d+u: signos envolvidos na cena</text>
</svg>